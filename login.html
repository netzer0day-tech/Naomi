<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login ✦ Naomi's Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Rajdhani:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--black:#04040a;--pink:#f72585;--cyan:#00f5ff;--purple:#6c2fa7;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.12);--text-main:#f0e8ff;--text-muted:rgba(200,180,255,0.6);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--text-main);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.login-card{background:linear-gradient(135deg,rgba(26,10,46,0.95),rgba(8,8,24,0.98));border:1px solid var(--glass-border);border-radius:24px;padding:48px 40px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,0.8);}
.login-icon{font-size:2.5rem;margin-bottom:20px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
h1{font-family:'Cinzel Decorative',serif;font-size:1rem;letter-spacing:0.1em;background:linear-gradient(135deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.9rem;color:var(--text-muted);margin-bottom:32px;}
.form-group{margin-bottom:20px;text-align:left;}
.form-label{display:block;font-size:0.65rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.form-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:10px;padding:12px 16px;color:var(--text-main);font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.form-input:focus{border-color:var(--pink);box-shadow:0 0 20px rgba(247,37,133,0.3);}
.btn{width:100%;padding:14px;border-radius:30px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:0.82rem;letter-spacing:0.2em;text-transform:uppercase;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 20px rgba(247,37,133,0.4);transition:all 0.3s;margin-top:8px;}
.btn:hover{box-shadow:0 8px 40px rgba(247,37,133,0.7);transform:translateY(-1px);}
.error{color:#f87171;font-size:0.78rem;margin-top:12px;opacity:0;transition:opacity 0.3s;}
.error.show{opacity:1;}
.back-link{display:block;margin-top:20px;font-size:0.72rem;color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
.back-link:hover{color:var(--pink);}
/* animated bg */
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.15;pointer-events:none;animation:float ease-in-out infinite;}
.orb1{width:400px;height:400px;background:var(--purple);top:-100px;left:-100px;animation-duration:8s;}
.orb2{width:300px;height:300px;background:var(--pink);bottom:-80px;right:-80px;animation-duration:10s;animation-delay:-3s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-30px);}}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="login-card">
  <div class="login-icon">💜</div>
  <h1>Naomi Admin</h1>
  <div class="subtitle">Enter to manage her world</div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" class="form-input" id="password" placeholder="••••••••••"
      onkeydown="if(event.key==='Enter')login()"/>
  </div>
  <button class="btn" onclick="login()">Enter ♥</button>
  <div class="error" id="error-msg">Incorrect password. Try again.</div>
  <a href="/" class="back-link">← Back to Naomi's Blog</a>
</div>

<script>
async function login() {
  const pw  = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pw })
  }).then(r=>r.json());

  if (res.success) {
    location.href = '/admin';
  } else {
    err.classList.add('show');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
    setTimeout(() => err.classList.remove('show'), 3000);
  }
}
</script>
</body>
</html>
